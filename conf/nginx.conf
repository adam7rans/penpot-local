# Penpot Local web server. Adapted from Penpot's official
# docker/images/files/nginx.conf.template (2.18.3), trimmed for one
# offline user: one worker, no external font/template proxies.

worker_processes 1;
daemon off;
pid __PENPOT_ROOT__/run/nginx.pid;
error_log __PENPOT_ROOT__/logs/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path __PENPOT_ROOT__/run/nginx/client_temp;
    proxy_temp_path       __PENPOT_ROOT__/run/nginx/proxy_temp;
    fastcgi_temp_path     __PENPOT_ROOT__/run/nginx/fastcgi_temp;
    uwsgi_temp_path       __PENPOT_ROOT__/run/nginx/uwsgi_temp;
    scgi_temp_path        __PENPOT_ROOT__/run/nginx/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include __PENPOT_ROOT__/conf/mime.types;
    default_type application/octet-stream;
    access_log off;

    include __PENPOT_ROOT__/conf/nginx-auth.conf;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_static on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/transit+json image/svg+xml application/wasm;

    proxy_buffer_size 16k;
    proxy_busy_buffers_size 24k;
    proxy_buffers 32 4k;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 127.0.0.1:9001;
        listen [::1]:9001;
        server_name localhost;

        client_max_body_size 367001600;
        charset utf-8;
        etag off;
        proxy_hide_header X-Powered-By;
        include __PENPOT_ROOT__/conf/nginx-security-headers.conf;

        root __PENPOT_ROOT__/app/frontend/;

        location @handle_redirect {
            set $redirect_uri "$upstream_http_location";
            set $redirect_host "$upstream_http_x_host";
            set $redirect_cache_control "$upstream_http_cache_control";
            set $real_mtype "$upstream_http_x_mtype";

            proxy_buffering off;
            proxy_set_header Host "$redirect_host";
            proxy_set_header Authorization "";
            proxy_hide_header etag;
            proxy_pass $redirect_uri;

            include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
            add_header x-internal-redirect "$redirect_uri";
            add_header x-cache-control "$redirect_cache_control";
            add_header cache-control "$redirect_cache_control";
            add_header content-type "$real_mtype";
        }

        location /assets {
            proxy_set_header Authorization $penpot_local_auth;
            proxy_set_header Cookie "";
            proxy_set_header Host $proxy_host;
            proxy_pass http://127.0.0.1:6060/assets;
            recursive_error_pages on;
            proxy_intercept_errors on;
            error_page 301 302 307 = @handle_redirect;
        }

        location /internal/assets {
            internal;
            alias __PENPOT_ROOT__/data/assets;
            include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
            add_header x-internal-redirect "$upstream_http_x_accel_redirect";
        }

        location /api/export {
            proxy_set_header Authorization $penpot_local_auth;
            proxy_set_header Cookie $penpot_export_cookie;
            proxy_set_header Host $proxy_host;
            proxy_pass http://127.0.0.1:6061;
        }

        location /api {
            proxy_set_header Authorization $penpot_local_auth;
            proxy_set_header Cookie "";
            proxy_set_header Host $proxy_host;
            proxy_pass http://127.0.0.1:6060/api;
            proxy_buffering off;
        }

        location /plugins {
            alias __PENPOT_ROOT__/app/frontend/plugins;
        }

        location /readyz {
            proxy_set_header Host $proxy_host;
            proxy_pass http://127.0.0.1:6060$request_uri;
        }

        location /ws/notifications {
            proxy_set_header Authorization $penpot_local_auth;
            proxy_set_header Cookie "";
            proxy_set_header Host $proxy_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_pass http://127.0.0.1:6060/ws/notifications;
        }

        # While the backend is still starting (no ready flag), show a
        # small "Starting Penpot…" page that reloads itself once it's up.
        location = / {
            if (!-f __PENPOT_ROOT__/run/ready) {
                rewrite ^ /starting.html last;
            }
            include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
            add_header Cache-Control "no-store, no-cache, max-age=0" always;
            try_files /index.html =404;
        }

        location = /starting.html {
            alias __PENPOT_ROOT__/conf/starting.html;
            include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
            add_header Cache-Control "no-store, no-cache, max-age=0" always;
        }

        location / {
            location = /js/config.js {
                include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
                add_header Cache-Control "no-store, no-cache, max-age=0" always;
            }

            location ~* \.(js|css|jpg|png|svg|gif|ttf|woff|woff2|wasm|map)$ {
                include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
                add_header Cache-Control "public, max-age=604800" always;
            }

            location ~ ^/[^/]+/(.*)$ {
                return 301 " /404";
            }

            include __PENPOT_ROOT__/conf/nginx-security-headers.conf;
            add_header Cache-Control "no-store, no-cache, max-age=0" always;
            try_files $uri /index.html$is_args$args /index.html =404;
        }
    }
}
